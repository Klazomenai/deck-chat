name: Lint Workflows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'devenv.nix'
      - 'devenv.lock'
      - 'flake.nix'
      - 'flake.lock'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'devenv.nix'
      - 'devenv.lock'
      - 'flake.nix'
      - 'flake.lock'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v14

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Run actionlint
        run: nix develop --command actionlint -color
