name: Build and Attach Signed APK (reusable)

on:
  workflow_call:
    inputs:
      tag:
        description: 'Git tag for the release (with v prefix, e.g. v0.1.0-alpha.7)'
        required: true
        type: string
      version:
        description: 'Semver version string without leading v (e.g. 0.1.0-alpha.7)'
        required: true
        type: string
    secrets:
      RELEASE_KEYSTORE_BASE64:
        required: true
      RELEASE_KEYSTORE_PASSWORD:
        required: true
      RELEASE_KEY_ALIAS:
        required: true
      RELEASE_KEY_PASSWORD:
        required: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and Attach Signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Validate release inputs
        id: validate_tag
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Match exactly the regex enforced by computeVersionCode in
          # app/build.gradle.kts so any input that would later fail the
          # Gradle build fails here first with a clear message.
          version_regex='^[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+(\.[0-9]+)?)?$'
          if [[ ! "$VERSION" =~ $version_regex ]]; then
            echo "Invalid version format: '$VERSION'. Expected <major>.<minor>.<patch>, optionally followed by -<label> or -<label>.<number> with lowercase labels." >&2
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v${version_regex#^} ]]; then
            echo "Invalid tag format: '$TAG'. Expected v<version> matching ${version_regex}." >&2
            exit 1
          fi
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "Tag/version mismatch: tag '$TAG' must equal 'v$VERSION'." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.validate_tag.outputs.tag }}

      - uses: DeterminateSystems/nix-installer-action@v14

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Download STT models
        run: nix develop --command bash scripts/download-stt-models.sh

      - name: Download TTS models
        run: nix develop --command bash scripts/download-tts-models.sh

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: nix develop --command ./gradlew assembleRelease

      - name: Rename APK
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mv "app/build/outputs/apk/release/app-release.apk" \
             "app/build/outputs/apk/release/deck-chat-${VERSION}.apk"

      - name: Create or update GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/deck-chat-${VERSION}.apk"
          gh_response="$(gh api --include "repos/${REPO}/releases/tags/${TAG}" 2>&1)" || gh_status=$?
          gh_status="${gh_status:-0}"
          http_status="$(printf '%s\n' "$gh_response" | awk '/^HTTP\/[0-9.]+ [0-9]+/ { print $2; exit }')"

          case "$http_status" in
            200)
              echo "Release $TAG exists — uploading asset (clobber)."
              gh release upload "$TAG" "$APK" --clobber
              ;;
            404)
              echo "Release $TAG missing — creating with auto-generated notes."
              gh release create "$TAG" "$APK" \
                --prerelease \
                --generate-notes \
                --title "$TAG"
              ;;
            *)
              echo "::error::Unexpected response while checking Release for tag ${TAG} (HTTP ${http_status:-unknown}, gh api exit ${gh_status})."
              printf '%s\n' "$gh_response"
              exit 1
              ;;
          esac

      - name: Verify Release artifact integrity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          apk_name="deck-chat-${VERSION}.apk"

          # Assertion 1: Release exists for the tag.
          # We just created or upload-clobbered the Release, so a non-zero exit
          # from `gh api` here indicates a real problem (transient API failure,
          # permission regression, or the upstream create/upload silently failed).
          release_json="$(gh api "repos/${REPO}/releases/tags/${TAG}" 2>&1)" || api_status=$?
          api_status="${api_status:-0}"
          if [ "$api_status" -ne 0 ]; then
            echo "::error::Assertion 1 failed (Release exists): could not query Release ${TAG} (gh api exit ${api_status})."
            printf '%s\n' "$release_json"
            exit 1
          fi

          # Assertion 2: prerelease == true.
          # Matches release-please-config.json `prerelease: true` and the
          # alpha-through-M2 versioning policy in RELEASE-PLEASE.md.
          prerelease="$(printf '%s' "$release_json" | jq -r '.prerelease')"
          if [ "$prerelease" != "true" ]; then
            echo "::error::Assertion 2 failed (prerelease flag): Release ${TAG} prerelease=${prerelease}, expected true."
            exit 1
          fi

          # Assertion 3: APK asset attached.
          # Empty `asset_size` from jq indicates "no asset of that name" (jq
          # returns no output when the filter matches nothing); explicit
          # empty-string check disambiguates this from `0` (zero bytes).
          asset_size="$(printf '%s' "$release_json" | jq -r --arg name "${apk_name}" '.assets[] | select(.name == $name) | .size')"
          if [ -z "$asset_size" ]; then
            echo "::error::Assertion 3 failed (APK asset attached): Release ${TAG} is missing asset ${apk_name}."
            echo "Attached assets:"
            printf '%s' "$release_json" | jq -r '.assets[].name' | sed 's/^/  - /'
            exit 1
          fi

          # Assertion 4: asset size > 0.
          if [ "$asset_size" = "0" ]; then
            echo "::error::Assertion 4 failed (asset size > 0): Release ${TAG} asset ${apk_name} has zero size."
            exit 1
          fi

          echo "Release ${TAG} integrity verified: prerelease=true, ${apk_name} attached (size=${asset_size} bytes)."

      - name: Annotate Release with Quartermaster's Log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # Fetch current Release body and id.
          release_json="$(gh api "repos/${REPO}/releases/tags/${TAG}" 2>&1)" || api_status=$?
          api_status="${api_status:-0}"
          if [ "$api_status" -ne 0 ]; then
            echo "::error::Failed to fetch Release ${TAG} for annotation (gh api exit ${api_status})."
            printf '%s\n' "$release_json"
            exit 1
          fi
          release_id="$(printf '%s' "$release_json" | jq -r '.id // empty')"
          if [ -z "$release_id" ]; then
            echo "::error::Failed to determine Release id for ${TAG}; response was malformed."
            printf '%s\n' "$release_json"
            exit 1
          fi
          # `.body // ""` so a JSON-null body becomes empty string, not the literal "null".
          body="$(printf '%s' "$release_json" | jq -r '.body // ""')"

          # Idempotency: skip if already annotated.
          if printf '%s' "$body" | grep -q "Quartermaster's Log"; then
            echo "Release ${TAG} already has Quartermaster's Log header — skipping annotation."
            exit 0
          fi

          # Curated banter (optional) — read .github/release-notes/<tag>.md if present.
          banter_file=".github/release-notes/${TAG}.md"
          curated_banter=""
          if [ -f "$banter_file" ]; then
            curated_banter="$(cat "$banter_file")"
            echo "Curated banter loaded from ${banter_file} (${#curated_banter} chars)."
          else
            echo "No curated banter file at ${banter_file}; auto-summary only."
          fi

          # Section counts — parse release-please's `### <emoji> <name>` / `* <item>` format.
          # Each section runs from its `### ` heading to the next `### ` heading.
          count_section() {
            local marker="$1"
            printf '%s\n' "$body" \
              | awk -v marker="$marker" '
                  $0 ~ "^### " marker { in_sec = 1; next }
                  /^### / && in_sec { exit }
                  in_sec && /^\* / { count++ }
                  END { print count + 0 }
                '
          }
          feat_count=$(count_section "⛵ New Rigging")
          fix_count=$(count_section "🔧 Hull Repairs")
          perf_count=$(count_section "⚡ Trimmed the Sails")
          refactor_count=$(count_section "♻️ Refitted")
          revert_count=$(count_section "↩️ Struck from the Log")
          security_count=$(count_section "🔐 Battened Hatches")

          summary_parts=()
          [ "$feat_count" -gt 0 ] && summary_parts+=("${feat_count} ⛵ new rigging")
          [ "$fix_count" -gt 0 ] && summary_parts+=("${fix_count} 🔧 hull repairs")
          [ "$perf_count" -gt 0 ] && summary_parts+=("${perf_count} ⚡ trimmed sails")
          [ "$refactor_count" -gt 0 ] && summary_parts+=("${refactor_count} ♻️ refitted")
          [ "$revert_count" -gt 0 ] && summary_parts+=("${revert_count} ↩️ struck from log")
          [ "$security_count" -gt 0 ] && summary_parts+=("${security_count} 🔐 battened hatches")

          summary_line=""
          if [ ${#summary_parts[@]} -gt 0 ]; then
            # Build the joined string explicitly: `${arr[*]}` with `IFS=', '` only uses
            # the FIRST character of IFS (i.e. `,`), so the spaces would be lost.
            joined=""
            for part in "${summary_parts[@]}"; do
              if [ -n "$joined" ]; then
                joined="${joined}, "
              fi
              joined="${joined}${part}"
            done
            summary_line="**This release:** ${joined}."
          fi

          # Milestone callout — fail-soft if the API calls error.
          # Find dominant milestone among issues referenced in the changelog body.
          milestone_callout=""
          issue_numbers="$(printf '%s' "$body" | grep -oE '#[0-9]+' | sort -u | tr -d '#' || true)"
          if [ -n "$issue_numbers" ]; then
            dominant_milestone="$(
              for n in $issue_numbers; do
                gh api "repos/${REPO}/issues/${n}" --jq '.milestone.title // empty' 2>/dev/null || true
              done | sort | uniq -c | sort -rn | head -1 | awk '{$1=""; sub(/^ /, ""); print}' || true
            )"
            if [ -n "${dominant_milestone:-}" ]; then
              ms_data="$(gh api "repos/${REPO}/milestones?state=all" --jq ".[] | select(.title == \"${dominant_milestone}\")" 2>/dev/null || true)"
              if [ -n "${ms_data:-}" ]; then
                ms_state="$(printf '%s' "$ms_data" | jq -r '.state')"
                ms_open="$(printf '%s' "$ms_data" | jq -r '.open_issues')"
                ms_closed="$(printf '%s' "$ms_data" | jq -r '.closed_issues')"
                ms_total=$((ms_open + ms_closed))
                if [ "$ms_state" = "closed" ] || [ "$ms_open" = "0" ]; then
                  milestone_callout="**🏴‍☠️ ${dominant_milestone}** — milestone complete (${ms_closed} of ${ms_total} issues closed)."
                else
                  milestone_callout="**🏴‍☠️ ${dominant_milestone}** — ${ms_closed} of ${ms_total} issues closed."
                fi
              fi
            fi
          fi
          if [ -z "${milestone_callout:-}" ]; then
            echo "Milestone callout omitted (no dominant milestone, or API lookup failed — fail-soft)."
          fi

          # Compose the Log header.
          {
            echo "## 🏴‍☠️ Quartermaster's Log"
            echo ""
            if [ -n "$curated_banter" ]; then
              printf '%s\n' "$curated_banter"
              echo ""
            fi
            [ -n "${milestone_callout:-}" ] && { printf '%s\n' "$milestone_callout"; echo ""; }
            [ -n "$summary_line" ] && { printf '%s\n' "$summary_line"; echo ""; }
            echo "---"
            echo ""
            printf '%s' "$body"
          } > /tmp/log_annotated_body.md

          # PATCH the Release body. `gh api -F body=@file` reads from file (rich body).
          gh api "repos/${REPO}/releases/${release_id}" \
            -X PATCH \
            -F body=@/tmp/log_annotated_body.md \
            >/dev/null

          echo "Quartermaster's Log header added to Release ${TAG}."

      - name: Summary
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## Signed APK Published"
            echo ""
            echo "**Version:** \`${VERSION}\`"
            echo "**Tag:** \`${TAG}\`"
            echo ""
            echo "Download: [deck-chat-${VERSION}.apk](https://github.com/${{ github.repository }}/releases/download/${TAG}/deck-chat-${VERSION}.apk)"
          } >> "$GITHUB_STEP_SUMMARY"
